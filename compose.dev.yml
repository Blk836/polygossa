name: polygossa-dev
services:
  postgres:
    image: postgres:17
    container_name: polygossa-dev-db
    environment:
      POSTGRES_DB: lector
      POSTGRES_USER: lector
      POSTGRES_PASSWORD: lector
    ports:
      - "5432:5432"
    volumes:
      - polygossa-dev-db:/var/lib/postgresql/data

volumes:
  polygossa-dev-db:
