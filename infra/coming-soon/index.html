<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Polygossa: coming soon</title>
<style>
  :root { --bg: #fffaf0; --ink: #2b2118; --soft: #6b5a48; --honey: #f2a900; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1d1712; --ink: #f6eee2; --soft: #c9b8a3; --honey: #f5b82e; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--bg); color: var(--ink); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 34rem; text-align: center; }
  .bee { font-size: 56px; line-height: 1; }
  h1 { margin: 16px 0 8px; font-size: clamp(28px, 6vw, 40px); }
  h1 span { color: var(--honey); }
  p { margin: 0; color: var(--soft); }
</style>
</head>
<body>
<main>
  <div class="bee" aria-hidden="true">🐝</div>
  <h1>Polygossa is <span>coming soon</span></h1>
  <p>Learn a language by reading what you love: click any word, keep the ones you meet, and watch what you know grow.</p>
</main>
</body>
</html>
