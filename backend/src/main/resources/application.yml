spring:
  application:
    name: lector
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/lector}
    username: ${DATABASE_USER:lector}
    password: ${DATABASE_PASSWORD:lector}
  docker:
    compose:
      enabled: ${DEV_COMPOSE:true}
      file: ${DEV_COMPOSE_FILE:../compose.dev.yml}
      lifecycle-management: start-only
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  cache:
    type: simple
  data:
    redis:
      repositories:
        enabled: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    redis:
      enabled: false

app:
  brand:
    name: ${BRAND_NAME:Polygossa}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    ttl: 7d
  tokenizer:
    url: ${TOKENIZER_URL:}
  storage:
    dir: ${STORAGE_DIR:./data/uploads}
    s3-bucket: ${STORAGE_S3_BUCKET:}
    s3-region: ${STORAGE_S3_REGION:eu-west-1}
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    daily-limit: ${AI_DAILY_LIMIT:30}
    system-daily-tokens: ${AI_SYSTEM_DAILY_TOKENS:500000}
    embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
  translation:
    enabled: ${TRANSLATION_ENABLED:false}
    region: ${TRANSLATION_REGION:eu-west-1}
    monthly-character-cap: ${TRANSLATION_MONTHLY_CHARACTER_CAP:1333333}
  lookup-prices:
    translate-per-million-characters: ${PRICE_TRANSLATE_PER_MILLION_CHARACTERS:15}
    ai-input-per-million-tokens: ${PRICE_AI_INPUT_PER_MILLION_TOKENS:0.15}
    ai-output-per-million-tokens: ${PRICE_AI_OUTPUT_PER_MILLION_TOKENS:0.60}
  recommend:
    feature-job: ${RECOMMEND_FEATURE_JOB:true}
  billing:
    enforce-limits: ${ENFORCE_PLAN_LIMITS:true}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    site-url: ${APP_URL:http://localhost:3000}
  cors-origins: ${CORS_ORIGINS:http://localhost:3000}
  seed-samples: ${SEED_SAMPLES:true}
  login:
    local-accounts: ${LOCAL_ACCOUNTS:true}
    cognito-issuer: ${COGNITO_ISSUER:}
    cognito-client-id: ${COGNITO_CLIENT_ID:}
  dev-auto-login: ${DEV_AUTO_LOGIN:true}
  forum:
    admins: ${FORUM_ADMINS:test@lector.local}
  curator-token: ${CURATOR_TOKEN:}
  youtube:
    audio:
      enabled: ${YOUTUBE_AUDIO_DOWNLOAD:true}
      yt-dlp: ${YTDLP:yt-dlp}
      cookies-from-browser: ${YTDLP_COOKIES_FROM_BROWSER:firefox}
  transcription:
    max-minutes: ${TRANSCRIPTION_MAX_MINUTES:30}
    budget-usd: ${TRANSCRIPTION_BUDGET_USD:10}
