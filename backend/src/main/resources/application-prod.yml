# Production: PostgreSQL primary datastore, Redis for dictionary response caching.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  cache:
    type: redis
    redis:
      time-to-live: 30d
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

management:
  health:
    redis:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
  # Forum admins must be named explicitly in production.
  forum:
    admins: ${FORUM_ADMINS:}
  # Never allow credential-free login in production.
  dev-auto-login: false
  # Everyone signs in through Cognito: the app's own accounts and tokens are off (docker-compose.yml, which has no
  # Cognito, turns them back on).
  login:
    local-accounts: ${LOCAL_ACCOUNTS:false}
