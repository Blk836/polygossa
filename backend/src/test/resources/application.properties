# Tests run the background feature job by hand (TextFeatureJob.runOnce), never on its schedule.
app.recommend.feature-job=false

# The forum admin that ForumApiTest signs up (FORUM_ADMINS in the app).
app.forum.admins=forum-admin@test.co

# Backend tests use a YouTube stub whose answers change between tests: never reuse an answer.
app.youtube.cache-ttl=0

# Tests run the weight-learning job by hand (WeightLearningJob.runOnce), never on its schedule.
app.recommend.learn.schedule=false
