# The gauntlet's checks (see CLAUDE.md) on every push and pull request, on Linux like production
# (docs/acceptance/ci.feature), then, on main only and only when every check passed, a deploy to staging on AWS
# (docs/acceptance/staging.feature). Mutation testing stays local (too slow per push). The checks have no secrets and
# no cloud access: tests never call OpenAI or AWS. Only the deploy job signs in to AWS, with short-lived credentials.
name: CI

# Changes arrive as pull requests (CLAUDE.md): checks run on each pull request, and again on main once merged (which is
# what deploys). Feature-branch pushes without a pull request aren't checked, so a pull request isn't checked twice.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**"]
  pull_request:
    paths-ignore: ["docs/**"]
  workflow_dispatch:
    inputs:
      # TEMPORARY, while the deploy itself is being worked on: deploy main to staging without running the checks.
      # Remove before production (docs/production.md, phase 8): then every deploy needs every check to pass.
      deploy_only:
        description: "Skip the checks and only deploy main to staging (temporary)"
        type: boolean
        default: false

# A newer push to a branch cancels its older run, except on main, where every commit keeps a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: backend
    if: ${{ !inputs.deploy_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :backend:compileJava :backend:checkstyleMain :backend:test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/test
          retention-days: 14

  frontend:
    name: frontend
    if: ${{ !inputs.deploy_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      # The global route types (PageProps, LayoutProps, RouteContext) that a fresh checkout lacks; next dev makes them locally.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx next build

  e2e:
    name: end-to-end
    if: ${{ !inputs.deploy_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      # Usually ~20 s, but the download has hung for 16+ minutes: each attempt gets 2 minutes, up to 3 attempts.
      - name: Install Chromium
        timeout-minutes: 7
        run: |
          for attempt in 1 2 3; do
            timeout 120 npx playwright install --with-deps chromium && exit 0
            echo "Chromium install attempt $attempt failed or hung; retrying"
          done
          exit 1
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14

  infra:
    name: infra
    if: ${{ !inputs.deploy_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: infra } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, cache-dependency-path: infra/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      # Synthesizes the stacks and checks their properties; no AWS access needed.
      - run: npm test
      # The whole app, as the deploy runs it (catches a missing entry point or config); lookups come from
      # cdk.context.json, so still no AWS access.
      - run: npx cdk synth --quiet
        env:
          CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: eu-west-1

  tools:
    name: tools
    if: ${{ !inputs.deploy_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }
      # ESLint comes from the frontend's packages; tools/ has none of its own.
      - run: npm ci
        working-directory: frontend
      - run: node --test "tools/**/*.test.mjs"
      - run: >-
          frontend/node_modules/.bin/eslint --no-config-lookup
          --rule '{"complexity":["error",10],"max-lines":["error",300]}' "tools/**/*.mjs"

  # Staging (docs/acceptance/staging.feature): after every green push to main. GitHub's OIDC token is exchanged for
  # short-lived credentials of the deploy role (infra/lib/github-deploy-stack.ts), which only main can assume.
  deploy:
    name: deploy staging
    needs: [backend, frontend, e2e, infra, tools]
    # After a push to main whose checks all passed, or (temporary) when started by hand on main with deploy_only.
    if: >-
      always() && github.ref == 'refs/heads/main' && (
        (github.event_name == 'push' && !contains(needs.*.result, 'failure')
          && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped'))
        || (github.event_name == 'workflow_dispatch' && inputs.deploy_only)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    # One deploy at a time; a newer one waits instead of cancelling a deploy halfway.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    defaults: { run: { working-directory: infra } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, cache-dependency-path: infra/package-lock.json }
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
      - run: npm ci
      # Builds the backend and frontend images, pushes them, and updates the stack.
      - run: npx cdk deploy PolygossaStaging --require-approval never --progress events
      - name: The site answers
        run: |
          url=$(aws cloudformation describe-stacks --stack-name PolygossaStaging \
            --query "Stacks[0].Outputs[?OutputKey=='SiteUrl'].OutputValue" --output text)
          echo "Staging: $url" >> "$GITHUB_STEP_SUMMARY"
          curl --fail --silent --show-error --retry 20 --retry-delay 15 --retry-all-errors -o /dev/null "$url/login"
