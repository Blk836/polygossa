# The gauntlet's checks (see CLAUDE.md) on every pull request, on Linux like production (docs/acceptance/ci.feature),
# and a deploy to staging on AWS when a pull request is merged to main (docs/acceptance/staging.feature). Mutation testing stays local (too slow per push). The checks have no secrets and
# no cloud access: tests never call OpenAI or AWS. Only the deploy job signs in to AWS, with short-lived credentials.
name: CI

# Changes arrive as pull requests (CLAUDE.md). The checks run on the pull request, against its merge with main; merging
# to main deploys without running them again, which would double the CI minutes for the same code. (A branch is updated
# from main and re-checked before merging if main has moved since.) Feature-branch pushes without a pull request aren't
# checked.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**"]
  pull_request:
    paths-ignore: ["docs/**"]
  workflow_dispatch:
    inputs:
      # TEMPORARY, while the deploy itself is being worked on: deploy main to staging by hand without the checks.
      # Remove before production (docs/production.md, phase 8).
      deploy_only:
        description: "Skip the checks and only deploy main to staging (temporary)"
        type: boolean
        default: false

# A newer push to a branch cancels its older run, except on main, where every commit keeps a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: backend
    if: github.event_name != 'push' && !inputs.deploy_only
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :backend:compileJava :backend:checkstyleMain :backend:test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/test
          retention-days: 14

  frontend:
    name: frontend
    if: github.event_name != 'push' && !inputs.deploy_only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      # The global route types (PageProps, LayoutProps, RouteContext) that a fresh checkout lacks; next dev makes them locally.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx next build

  # The browser suite is CPU-bound and a private repository's runner has 2 cores (Playwright runs 1 worker there), so it
  # is split across 4 runners that each run a quarter of the tests: about 3-4 minutes instead of 7, for roughly twice
  # the CI minutes (each runner builds the backend and frontend itself).
  e2e:
    name: end-to-end (${{ matrix.shard }}/4)
    if: github.event_name != 'push' && !inputs.deploy_only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      # Next's build cache: the production build the suite runs against reuses what didn't change.
      - uses: actions/cache@v6
        with:
          path: frontend/.next/cache
          key: next-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/app/**', 'frontend/components/**', 'frontend/lib/**') }}
          restore-keys: next-${{ hashFiles('frontend/package-lock.json') }}-
      # No browser install: the tests drive the runner's preinstalled Google Chrome (playwright.config.ts). Installing
      # Playwright's Chromium ran apt, and an unresponsive Ubuntu mirror hung shards for 15+ minutes.
      - run: google-chrome --version
      - run: npx playwright test --shard=${{ matrix.shard }}/4
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: frontend/playwright-report
          retention-days: 14

  infra:
    name: infra
    if: github.event_name != 'push' && !inputs.deploy_only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: infra } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, cache-dependency-path: infra/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      # Synthesizes the stacks and checks their properties; no AWS access needed.
      - run: npm test
      # The whole app, as the deploy runs it (catches a missing entry point or config); lookups come from
      # cdk.context.json, so still no AWS access.
      - run: npx cdk synth --quiet
        env:
          CDK_DEFAULT_ACCOUNT: ${{ vars.AWS_ACCOUNT_ID }}
          CDK_DEFAULT_REGION: eu-west-1

  tools:
    name: tools
    if: github.event_name != 'push' && !inputs.deploy_only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, cache-dependency-path: frontend/package-lock.json }
      # ESLint comes from the frontend's packages; tools/ has none of its own.
      - run: npm ci
        working-directory: frontend
      - run: node --test "tools/**/*.test.mjs"
      - run: >-
          frontend/node_modules/.bin/eslint --no-config-lookup
          --rule '{"complexity":["error",10],"max-lines":["error",300]}' "tools/**/*.mjs"

  # Staging (docs/acceptance/staging.feature): on every merge to main. GitHub's OIDC token is exchanged for
  # short-lived credentials of the deploy role (infra/lib/github-deploy-stack.ts), which only main can assume.
  deploy:
    name: deploy staging
    # A merge to main (its pull request's checks passed), or (temporary) a hand-started deploy_only run on main.
    if: >-
      github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_only))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    # One deploy at a time; a newer one waits instead of cancelling a deploy halfway.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    defaults: { run: { working-directory: infra } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "24", cache: npm, cache-dependency-path: infra/package-lock.json }
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
      - run: npm ci
      # Builds the backend and frontend images, pushes them, and updates the stack.
      - run: npx cdk deploy PolygossaStaging --require-approval never --progress events
      - name: The site answers
        run: |
          url=$(aws cloudformation describe-stacks --stack-name PolygossaStaging \
            --query "Stacks[0].Outputs[?OutputKey=='SiteUrl'].OutputValue" --output text)
          echo "Staging: $url" >> "$GITHUB_STEP_SUMMARY"
          curl --fail --silent --show-error --retry 20 --retry-delay 15 --retry-all-errors -o /dev/null "$url/login"
